<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D Video Composer</title>

<style>
*{box-sizing:border-box}
html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#090a0d;
color:#fff;
font-family:Arial,sans-serif
}

#app{
width:100%;
height:100%;
display:flex;
flex-direction:column
}

#top{
height:54px;
flex-shrink:0;
display:flex;
align-items:center;
gap:8px;
padding:8px 12px;
background:#111319;
border-bottom:1px solid #292d36
}

.logo{
font-weight:bold;
font-size:16px;
margin-right:15px
}

button{
border:1px solid #383d49;
background:#1b1e26;
color:#fff;
border-radius:6px;
padding:9px 13px;
cursor:pointer
}

button:hover{
background:#292d38
}

.primary{
background:#6746dc;
border-color:#8064ee
}

#workspace{
flex:1;
display:flex;
min-height:0
}

#stage{
position:relative;
flex:1;
overflow:hidden;
background:#15171c
}

#video{
position:absolute;
inset:0;
width:100%;
height:100%;
object-fit:contain;
background:#08090c
}

#videoPlaceholder{
position:absolute;
inset:0;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
color:#777;
pointer-events:none
}

#videoPlaceholder strong{
font-size:20px;
color:#aaa
}

#threeLayer{
position:absolute;
inset:0;
pointer-events:none
}

#threeLayer canvas{
width:100%!important;
height:100%!important
}

#dropModel{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
padding:14px 22px;
border:2px dashed #7658e4;
border-radius:10px;
background:#1118;
color:#b8a9ff;
z-index:20;
display:none;
pointer-events:none
}

#right{
width:300px;
flex-shrink:0;
background:#111319;
border-left:1px solid #292d36;
overflow:auto
}

.section{
padding:14px;
border-bottom:1px solid #292d36
}

.title{
font-size:12px;
font-weight:bold;
color:#aaa;
margin-bottom:10px
}

#animationList{
display:flex;
flex-direction:column;
gap:6px
}

.animation{
display:flex;
align-items:center;
gap:7px;
padding:9px;
background:#1a1d24;
border:1px solid #30343e;
border-radius:6px;
cursor:pointer
}

.animation:hover{
background:#252934
}

.animation.active{
background:#5037a1;
border-color:#8065e8
}

.animationName{
flex:1;
font-size:12px;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap
}

.play{
padding:6px 9px
}

.info{
font-size:11px;
color:#777;
line-height:1.5
}

.control{
display:grid;
grid-template-columns:1fr 80px;
gap:8px;
align-items:center;
margin:7px 0
}

.control span{
font-size:11px;
color:#aaa
}

input[type=range]{
width:100%
}

#fileInput{
display:none
}

#videoInput{
display:none
}

#status{
position:absolute;
left:12px;
bottom:12px;
padding:8px 10px;
background:#000b;
border-radius:6px;
font-size:11px;
z-index:30
}

#modelBadge{
position:absolute;
top:12px;
left:12px;
padding:8px 10px;
background:#000b;
border-radius:6px;
font-size:11px;
z-index:30;
display:none
}

#centerControls{
position:absolute;
left:50%;
bottom:15px;
transform:translateX(-50%);
display:flex;
gap:6px;
z-index:40;
background:#000b;
padding:6px;
border-radius:8px
}

#centerControls button{
padding:8px 12px
}

#loading{
position:absolute;
inset:0;
background:#000b;
display:none;
align-items:center;
justify-content:center;
z-index:100;
font-size:15px
}
</style>
</head>

<body>

<div id="app">

<div id="top">

<div class="logo">3D VIDEO COMPOSER</div>

<button id="videoButton">
🎬 Video
</button>

<input
id="videoInput"
type="file"
accept="video/*"
>

<button id="modelButton" class="primary">
📦 FBX Modell
</button>

<input
id="fileInput"
type="file"
accept=".fbx"
>

<button id="playButton">
▶ Animation
</button>

<button id="stopButton">
■
</button>

</div>


<div id="workspace">

<div id="stage">

<video
id="video"
controls
playsinline
></video>

<div id="videoPlaceholder">
<strong>Video laden</strong>
<span>Wähle oben ein Video aus</span>
</div>

<div id="threeLayer"></div>

<div id="dropModel">
FBX-MODELL HIER PLATZIEREN
</div>

<div id="modelBadge"></div>

<div id="status">
Bereit
</div>

<div id="centerControls">

<button id="moveUp">↑</button>
<button id="moveLeft">←</button>
<button id="moveDown">↓</button>
<button id="moveRight">→</button>
<button id="scaleDown">−</button>
<button id="scaleUp">＋</button>

</div>

<div id="loading">
FBX wird geladen...
</div>

</div>


<div id="right">

<div class="section">

<div class="title">
ANIMATIONEN DES FBX-MODELLS
</div>

<div id="animationList">

<div class="info">
Noch kein FBX-Modell geladen.
</div>

</div>

</div>


<div class="section">

<div class="title">
MODELL POSITION
</div>

<div class="control">
<span>X</span>
<input
id="posX"
type="range"
min="-5"
max="5"
step="0.01"
value="0"
>
</div>

<div class="control">
<span>Y</span>
<input
id="posY"
type="range"
min="-5"
max="5"
step="0.01"
value="0"
>
</div>

<div class="control">
<span>Z</span>
<input
id="posZ"
type="range"
min="-10"
max="10"
step="0.01"
value="0"
>
</div>

</div>


<div class="section">

<div class="title">
MODELL GRÖSSE
</div>

<div class="control">
<span>Größe</span>
<input
id="scale"
type="range"
min="0.05"
max="5"
step="0.01"
value="1"
>
</div>

</div>


<div class="section">

<div class="title">
MODELL DREHUNG
</div>

<div class="control">
<span>X</span>
<input
id="rotX"
type="range"
min="-180"
max="180"
value="0"
>
</div>

<div class="control">
<span>Y</span>
<input
id="rotY"
type="range"
min="-180"
max="180"
value="0"
>
</div>

<div class="control">
<span>Z</span>
<input
id="rotZ"
type="range"
min="-180"
max="180"
value="0"
>
</div>

</div>


<div class="section">

<div class="title">
FBX
</div>

<div id="modelInfo" class="info">
Kein Modell geladen.
</div>

</div>

</div>

</div>

</div>


<script type="importmap">
{
"imports":{
"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
}
}
</script>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

import {FBXLoader} from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/FBXLoader.js";

import {OrbitControls} from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js";


/* =========================================
   ELEMENTE
========================================= */

const stage=
document.getElementById("stage");

const layer=
document.getElementById("threeLayer");

const video=
document.getElementById("video");

const fileInput=
document.getElementById("fileInput");

const videoInput=
document.getElementById("videoInput");

const animationList=
document.getElementById("animationList");

const status=
document.getElementById("status");

const loading=
document.getElementById("loading");

const placeholder=
document.getElementById("videoPlaceholder");

const modelBadge=
document.getElementById("modelBadge");


/* =========================================
   VIDEO
========================================= */

document.getElementById("videoButton").onclick=()=>{
videoInput.click();
};

videoInput.onchange=e=>{

const file=e.target.files[0];

if(!file)return;

video.src=
URL.createObjectURL(file);

video.controls=true;

placeholder.style.display="none";

setStatus("Video geladen");

};


/* =========================================
   THREE
========================================= */

const scene=
new THREE.Scene();

const camera=
new THREE.PerspectiveCamera(
45,
stage.clientWidth/stage.clientHeight,
0.01,
10000
);

camera.position.set(
0,
1.5,
6
);

const renderer=
new THREE.WebGLRenderer({
alpha:true,
antialias:true,
preserveDrawingBuffer:true
});

renderer.setPixelRatio(
Math.min(window.devicePixelRatio,2)
);

renderer.setSize(
stage.clientWidth,
stage.clientHeight
);

renderer.setClearColor(
0x000000,
0
);

renderer.shadowMap.enabled=true;

layer.appendChild(
renderer.domElement
);


const controls=
new OrbitControls(
camera,
renderer.domElement
);

controls.enableDamping=true;
controls.enabled=false;


const ambient=
new THREE.HemisphereLight(
0xffffff,
0x333333,
2.5
);

scene.add(ambient);


const directional=
new THREE.DirectionalLight(
0xffffff,
3
);

directional.position.set(
5,
10,
5
);

directional.castShadow=true;

scene.add(directional);


/* =========================================
   FBX
========================================= */

const loader=
new FBXLoader();

let model=null;
let mixer=null;
let animations=[];
let currentAction=null;
let currentAnimation=null;


document.getElementById("modelButton").onclick=()=>{
fileInput.click();
};


fileInput.onchange=async e=>{

const file=e.target.files[0];

if(!file)return;

await loadFBX(file);

};


async function loadFBX(file){

loading.style.display="flex";

setStatus(
"FBX wird geladen..."
);

try{

const url=
URL.createObjectURL(file);

const object=
await loader.loadAsync(url);

URL.revokeObjectURL(url);


if(model){

scene.remove(model);

}


model=object;

model.traverse(child=>{

if(child.isMesh){

child.castShadow=true;
child.receiveShadow=true;

}

});


scene.add(model);


/*
DAS MODELL WIRD WIE IM VORHERIGEN
3D-CODE ZENTRIERT.
*/

centerModel();


/*
ANIMATIONEN DIREKT AUS DEM FBX.
*/

animations=[
...(model.animations||[])
];


mixer=
new THREE.AnimationMixer(model);


document.getElementById("modelInfo").textContent=
file.name+
" • "+
animations.length+
" Animation(en)";


modelBadge.style.display="block";

modelBadge.textContent=
file.name;


createAnimationButtons();


if(animations.length){

selectAnimation(0);

}else{

setStatus(
"Modell geladen – keine Animationen gefunden"
);

}


loading.style.display="none";

}catch(error){

console.error(error);

loading.style.display="none";

setStatus(
"Fehler beim Laden des FBX"
);

}

}


/* =========================================
   MODELL ZENTRIEREN
========================================= */

function centerModel(){

if(!model)return;

const box=
new THREE.Box3()
.setFromObject(model);

const center=
box.getCenter(
new THREE.Vector3()
);

const size=
box.getSize(
new THREE.Vector3()
);

model.position.sub(center);


const max=
Math.max(
size.x,
size.y,
size.z
);


/*
KAMERA WIE IM VORHERIGEN CODE.
*/

camera.position.set(
max*1.8,
max*1.2,
max*2.2
);

camera.near=
Math.max(max/1000,0.001);

camera.far=
Math.max(max*100,1000);

camera.updateProjectionMatrix();

}


/* =========================================
   ANIMATIONEN RECHTS
========================================= */

function createAnimationButtons(){

animationList.innerHTML="";

if(!animations.length){

animationList.innerHTML=
'<div class="info">'+
'Dieses FBX enthält keine Animationen.'+
'</div>';

return;

}


animations.forEach(
(clip,index)=>{

const row=
document.createElement("div");

row.className="animation";

const name=
document.createElement("div");

name.className="animationName";

name.textContent=
clip.name||
"Animation "+(index+1);

const play=
document.createElement("button");

play.className="play";

play.textContent="▶";

play.onclick=e=>{

e.stopPropagation();

selectAnimation(index);

playAnimation();

};


row.appendChild(name);
row.appendChild(play);


row.onclick=()=>{

selectAnimation(index);

};


animationList.appendChild(row);

});

}


/* =========================================
   ANIMATION AUSWÄHLEN
========================================= */

function selectAnimation(index){

if(!mixer)return;

if(currentAction){

currentAction.stop();

}

currentAnimation=
animations[index];

currentAction=
mixer.clipAction(
currentAnimation
);

currentAction.reset();

currentAction.play();

currentAction.paused=true;


document
.querySelectorAll(".animation")
.forEach((el,i)=>{

el.classList.toggle(
"active",
i===index
);

});


setStatus(
"Animation: "+
currentAnimation.name
);

}


/* =========================================
   PLAY
========================================= */

function playAnimation(){

if(!currentAction){

if(animations.length){

selectAnimation(0);

}else{

return;

}

}

currentAction.paused=false;

currentAction.play();

setStatus(
"▶ "+
currentAnimation.name
);

}

document.getElementById("playButton")
.onclick=playAnimation;


document.getElementById("stopButton")
.onclick=()=>{

if(currentAction){

currentAction.paused=true;

}

setStatus("Animation pausiert");

};


/* =========================================
   TRANSFORM
========================================= */

function updateTransform(){

if(!model)return;

model.position.x=
Number(document.getElementById("posX").value);

model.position.y=
Number(document.getElementById("posY").value);

model.position.z=
Number(document.getElementById("posZ").value);


model.scale.setScalar(
Number(document.getElementById("scale").value)
);


model.rotation.x=
THREE.MathUtils.degToRad(
Number(document.getElementById("rotX").value)
);

model.rotation.y=
THREE.MathUtils.degToRad(
Number(document.getElementById("rotY").value)
);

model.rotation.z=
THREE.MathUtils.degToRad(
Number(document.getElementById("rotZ").value)
);

}


[
"posX",
"posY",
"posZ",
"scale",
"rotX",
"rotY",
"rotZ"
].forEach(id=>{

document.getElementById(id)
.addEventListener(
"input",
updateTransform
);

});


/* =========================================
   SCHNELLE POSITION
========================================= */

function change(id,value){

const input=
document.getElementById(id);

input.value=
Number(input.value)+value;

updateTransform();

}


document.getElementById("moveUp")
.onclick=()=>change("posY",0.1);

document.getElementById("moveDown")
.onclick=()=>change("posY",-0.1);

document.getElementById("moveLeft")
.onclick=()=>change("posX",-0.1);

document.getElementById("moveRight")
.onclick=()=>change("posX",0.1);

document.getElementById("scaleUp")
.onclick=()=>change("scale",0.1);

document.getElementById("scaleDown")
.onclick=()=>change("scale",-0.1);


/* =========================================
   MOUSE: MODELL ÜBER VIDEO ZIEHEN
========================================= */

let dragging=false;

let dragX=0;
let dragY=0;

layer.addEventListener(
"pointerdown",
e=>{

if(!model)return;

dragging=true;

dragX=e.clientX;
dragY=e.clientY;

layer.setPointerCapture(e.pointerId);

}
);


layer.addEventListener(
"pointermove",
e=>{

if(!dragging||!model)return;

const dx=
(e.clientX-dragX)/
100;

const dy=
(e.clientY-dragY)/
100;

model.position.x+=dx;
model.position.y-=dy;

document.getElementById("posX").value=
model.position.x;

document.getElementById("posY").value=
model.position.y;

dragX=e.clientX;
dragY=e.clientY;

}
);


layer.addEventListener(
"pointerup",
()=>{
dragging=false;
}
);


/* =========================================
   MAUSRAD = GRÖSSE
========================================= */

layer.addEventListener(
"wheel",
e=>{

if(!model)return;

e.preventDefault();

const amount=
e.deltaY>0
?-0.05
:0.05;

model.scale.multiplyScalar(
Math.max(
0.05,
1+amount
)
);

document.getElementById("scale").value=
model.scale.x;

},
{passive:false}
);


/* =========================================
   STATUS
========================================= */

function setStatus(text){

status.textContent=text;

}


/* =========================================
   ANIMATION LOOP
========================================= */

const clock=
new THREE.Clock();

function animate(){

requestAnimationFrame(animate);

const delta=
clock.getDelta();

if(mixer){

mixer.update(delta);

}

controls.update();

renderer.render(
scene,
camera
);

}

animate();


/* =========================================
   RESIZE
========================================= */

window.addEventListener(
"resize",
()=>{

const w=
stage.clientWidth;

const h=
stage.clientHeight;

camera.aspect=w/h;

camera.updateProjectionMatrix();

renderer.setSize(w,h);

}
);


/* =========================================
   TASTATUR
========================================= */

window.addEventListener(
"keydown",
e=>{

if(
e.target.tagName==="INPUT"
)return;


if(e.code==="Space"){

e.preventDefault();

if(currentAction){

currentAction.paused=
!currentAction.paused;

}

}


if(e.key==="ArrowUp"){

change("posY",0.1);

}

if(e.key==="ArrowDown"){

change("posY",-0.1);

}

if(e.key==="ArrowLeft"){

change("posX",-0.1);

}

if(e.key==="ArrowRight"){

change("posX",0.1);

}

}
);

</script>

</body>
</html>
