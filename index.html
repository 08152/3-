<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FBX Video Editor</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101114;color:#fff;font-family:Arial}
button,input,select{font:inherit}
button{background:#242832;color:white;border:1px solid #444b58;border-radius:6px;padding:9px 14px;cursor:pointer}
button:hover{background:#343a46}
button:active{transform:scale(.98)}
.primary{background:#6646e8;border-color:#8065ef}
.top{
height:52px;background:#17191f;border-bottom:1px solid #30343d;
display:flex;align-items:center;gap:8px;padding:7px 10px
}
.logo{font-weight:bold;margin-right:15px;color:#a58cff}
.main{height:calc(100% - 52px);display:grid;grid-template-rows:minmax(0,1fr) 190px}
.preview{position:relative;background:#08090c}
canvas{width:100%;height:100%;display:block}
.hud{
position:absolute;top:10px;left:10px;background:#000b;padding:8px 12px;
border-radius:6px;font-size:12px;color:#bfc5d1
}
.controls{
position:absolute;bottom:12px;left:50%;transform:translateX(-50%);
display:flex;gap:6px;background:#1117;padding:7px;border-radius:9px
}
.timeline{
background:#15171d;border-top:1px solid #343943;
position:relative;overflow:auto
}
.ruler{
height:30px;position:relative;border-bottom:1px solid #343943;
min-width:1200px;background:#191c23
}
.tick{
position:absolute;top:0;height:30px;border-left:1px solid #454b58;
font-size:10px;color:#8d95a5;padding-left:3px
}
.track{
height:70px;position:relative;border-bottom:1px solid #292d35;
min-width:1200px
}
.label{
position:sticky;left:0;top:0;z-index:5;
width:110px;height:70px;background:#181b22;
border-right:1px solid #343943;padding:26px 8px;font-size:11px
}
.clip{
position:absolute;left:115px;top:10px;height:50px;
border-radius:7px;padding:17px 10px;
background:#4a329b;border:1px solid #846ce0;
font-size:12px;overflow:hidden;white-space:nowrap
}
.clip.video{background:#24537b}
.playhead{
position:absolute;top:0;bottom:0;width:2px;background:#ff4058;
z-index:20;pointer-events:none
}
.playhead:before{
content:"";position:absolute;top:0;left:-5px;
border-left:6px solid transparent;border-right:6px solid transparent;
border-top:8px solid #ff4058
}
#fileFBX,#fileVideo{display:none}
.modal{
position:absolute;inset:0;background:#000b;display:none;
align-items:center;justify-content:center;z-index:100
}
.modalBox{
background:#181b22;border:1px solid #454b58;border-radius:10px;
padding:20px;min-width:280px
}
.row{display:flex;gap:7px;align-items:center}
</style>
</head>

<body>

<header class="top">
<div class="logo">FBX VIDEO EDITOR</div>

<button id="fbxButton">＋ FBX</button>
<button id="videoButton">＋ VIDEO</button>
<button id="playButton">▶</button>
<button id="stopButton">■</button>

<div style="flex:1"></div>

<span id="time">00:00:00.000</span>

<button id="exportButton" class="primary">WEBM EXPORT</button>
</header>

<div class="main">

<div class="preview">
<canvas id="canvas"></canvas>
<div class="hud" id="hud">Noch kein Modell geladen</div>

<div class="controls">
<button id="rewind">⏮</button>
<button id="centerPlay">▶</button>
<button id="forward">⏭</button>
</div>
</div>

<div class="timeline" id="timeline">

<div class="ruler" id="ruler"></div>

<div class="track" id="modelTrack">
<div class="label">3D / FBX</div>
</div>

<div class="track" id="videoTrack">
<div class="label">VIDEO</div>
</div>

<div class="playhead" id="playhead"></div>

</div>

</div>

<input id="fileFBX" type="file" accept=".fbx">
<input id="fileVideo" type="file" accept="video/*">

<div class="modal" id="exportModal">
<div class="modalBox">
<h3>WEBM wird erstellt</h3>
<div id="exportProgress">0%</div>
<br>
<div style="width:260px;height:8px;background:#30343d;border-radius:5px">
<div id="progressBar" style="height:100%;width:0%;background:#7657ed;border-radius:5px"></div>
</div>
</div>
</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

import {OrbitControls} from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js";

import {FBXLoader} from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/FBXLoader.js";


/* =========================
   THREE
========================= */

const canvas=document.getElementById("canvas");

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x11151c);

const camera=new THREE.PerspectiveCamera(
45,
1,
0.01,
5000
);

camera.position.set(4,3,7);

const renderer=new THREE.WebGLRenderer({
canvas,
antialias:true,
preserveDrawingBuffer:true
});

renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;

const controls=new OrbitControls(camera,canvas);
controls.enableDamping=true;

scene.add(
new THREE.HemisphereLight(
0xffffff,
0x344455,
2.5
)
);

const light=new THREE.DirectionalLight(
0xffffff,
3
);

light.position.set(5,8,5);
scene.add(light);

const grid=new THREE.GridHelper(
40,
40,
0x444a55,
0x252a32
);

scene.add(grid);


/* =========================
   VARIABLES
========================= */

let model=null;
let mixer=null;
let animations=[];
let currentAnimation=null;

let video=null;
let videoTexture=null;
let videoMesh=null;

let playing=false;
let time=0;
let duration=10;

let lastFrame=performance.now();

const PIXELS_PER_SECOND=100;


/* =========================
   RESIZE
========================= */

function resize(){

const rect=canvas.getBoundingClientRect();

renderer.setSize(
rect.width,
rect.height,
false
);

camera.aspect=rect.width/rect.height;
camera.updateProjectionMatrix();

}

window.addEventListener("resize",resize);
resize();


/* =========================
   FBX
========================= */

document.getElementById("fbxButton").onclick=()=>{
document.getElementById("fileFBX").click();
};

document.getElementById("fileFBX").onchange=e=>{

const file=e.target.files[0];

if(!file)return;

loadFBX(file);

};


function loadFBX(file){

const url=URL.createObjectURL(file);

const loader=new FBXLoader();

loader.load(
url,

object=>{

if(model){

scene.remove(model);

}

model=object;

model.position.set(0,0,0);
model.rotation.set(0,0,0);
model.scale.set(1,1,1);

model.traverse(child=>{

if(child.isMesh){

child.castShadow=true;
child.receiveShadow=true;

if(child.material){
child.material.needsUpdate=true;
}

}

});

scene.add(model);

animations=object.animations||[];

if(animations.length){

mixer=new THREE.AnimationMixer(model);

currentAnimation=mixer.clipAction(
animations[0]
);

currentAnimation.play();

}

document.getElementById("hud").textContent=
file.name+
"  •  "+
animations.length+
" Animation"+(animations.length===1?"":"en");

createModelClip(file.name);

URL.revokeObjectURL(url);

},

undefined,

error=>{
console.error(error);
alert(
"FBX konnte nicht geladen werden.\n\n"+
"Die Datei muss eine gültige FBX-Datei sein."
);
}

);

}


/* =========================
   VIDEO
========================= */

document.getElementById("videoButton").onclick=()=>{
document.getElementById("fileVideo").click();
};


document.getElementById("fileVideo").onchange=e=>{

const file=e.target.files[0];

if(!file)return;

loadVideo(file);

};


function loadVideo(file){

const url=URL.createObjectURL(file);

if(video){

video.pause();

video.remove();

}

video=document.createElement("video");

video.src=url;
video.muted=true;
video.playsInline=true;
video.preload="auto";

document.body.appendChild(video);

video.style.display="none";

video.onloadedmetadata=()=>{

duration=video.duration||10;

createVideoClip(file.name,duration);

videoTexture=new THREE.VideoTexture(video);

videoTexture.colorSpace=THREE.SRGBColorSpace;

const geometry=
new THREE.PlaneGeometry(16,9);

const material=
new THREE.MeshBasicMaterial({
map:videoTexture
});

videoMesh=
new THREE.Mesh(
geometry,
material
);

videoMesh.position.set(
0,
0,
-5
);

scene.add(videoMesh);

document.getElementById("hud").textContent=
file.name+
"  •  "+
formatTime(duration);

createRuler();

};

video.load();

}


/* =========================
   TIMELINE
========================= */

function createModelClip(name){

const track=
document.getElementById("modelTrack");

track.querySelectorAll(".clip").forEach(e=>e.remove());

const clip=document.createElement("div");

clip.className="clip";

clip.textContent=
"FBX  •  "+name;

clip.style.left="115px";
clip.style.width=
Math.max(150,duration*PIXELS_PER_SECOND)+"px";

track.appendChild(clip);

}


function createVideoClip(name,d){

const track=
document.getElementById("videoTrack");

track.querySelectorAll(".clip").forEach(e=>e.remove());

const clip=document.createElement("div");

clip.className="clip video";

clip.textContent=
"VIDEO  •  "+name;

clip.style.left="115px";

clip.style.width=
Math.max(150,d*PIXELS_PER_SECOND)+"px";

track.appendChild(clip);

}


function createRuler(){

const ruler=
document.getElementById("ruler");

ruler.innerHTML="";

for(let i=0;i<=Math.ceil(duration);i++){

const tick=document.createElement("div");

tick.className="tick";

tick.style.left=
(115+i*PIXELS_PER_SECOND)+"px";

tick.textContent=
formatTime(i);

ruler.appendChild(tick);

}

ruler.style.width=
(115+duration*PIXELS_PER_SECOND+300)+"px";

document.querySelectorAll(".track").forEach(
track=>{
track.style.width=
(115+duration*PIXELS_PER_SECOND+300)+"px";
}
);

}


/* =========================
   TIME
========================= */

function setTime(t){

time=Math.max(
0,
Math.min(duration,t)
);

if(video){

try{
video.currentTime=time;
}catch{}

}

if(mixer){

mixer.setTime(time);

}

updateTimeline();

}


function updateTimeline(){

document.getElementById("time").textContent=
formatTime(time);

document.getElementById("playhead").style.left=
(115+time*PIXELS_PER_SECOND)+"px";

}


function formatTime(seconds){

const ms=Math.floor(
(seconds%1)*1000
);

const total=Math.floor(seconds);

const s=total%60;
const m=Math.floor(total/60)%60;
const h=Math.floor(total/3600);

return String(h).padStart(2,"0")+
":"+
String(m).padStart(2,"0")+
":"+
String(s).padStart(2,"0")+
"."+
String(ms).padStart(3,"0");

}


/* =========================
   PLAYBACK
========================= */

function play(){

playing=true;

if(video){

video.play().catch(()=>{});

}

if(currentAnimation){

currentAnimation.paused=false;

}

document.getElementById("playButton").textContent="❚❚";
document.getElementById("centerPlay").textContent="❚❚";

}


function pause(){

playing=false;

if(video){
video.pause();
}

document.getElementById("playButton").textContent="▶";
document.getElementById("centerPlay").textContent="▶";

}


function togglePlay(){

if(playing)pause();
else play();

}


document.getElementById("playButton").onclick=togglePlay;
document.getElementById("centerPlay").onclick=togglePlay;

document.getElementById("stopButton").onclick=()=>{
pause();
setTime(0);
};

document.getElementById("rewind").onclick=()=>{
setTime(0);
};

document.getElementById("forward").onclick=()=>{
setTime(Math.min(duration,time+1));
};


/* =========================
   TIMELINE CLICK
========================= */

document.getElementById("timeline").addEventListener(
"pointerdown",
e=>{

if(e.target.closest(".clip"))return;

const rect=
document.getElementById("timeline").getBoundingClientRect();

const x=
e.clientX-
rect.left+
document.getElementById("timeline").scrollLeft;

setTime(
Math.max(
0,
(x-115)/PIXELS_PER_SECOND
)
);

}
);


/* =========================
   RENDER LOOP
========================= */

function loop(now){

requestAnimationFrame(loop);

const dt=
Math.min(
0.05,
(now-lastFrame)/1000
);

lastFrame=now;

if(playing){

time+=dt;

if(time>=duration){

time=duration;
pause();

}

if(mixer){

mixer.update(dt);

}

if(video){

if(Math.abs(video.currentTime-time)>0.08){

try{
video.currentTime=time;
}catch{}

}

}

updateTimeline();

}

controls.update();

renderer.render(
scene,
camera
);

}

requestAnimationFrame(loop);


/* =========================
   WEBM EXPORT
========================= */

document.getElementById("exportButton").onclick=
exportWebM;


async function exportWebM(){

if(!model && !video){

alert(
"Importiere zuerst ein FBX-Modell oder ein Video."
);

return;

}

const modal=
document.getElementById("exportModal");

modal.style.display="flex";

const progress=
document.getElementById("progressBar");

const progressText=
document.getElementById("exportProgress");


const exportWidth=1280;
const exportHeight=720;
const fps=30;


/* Rendergröße */

renderer.setSize(
exportWidth,
exportHeight,
false
);

camera.aspect=
exportWidth/exportHeight;

camera.updateProjectionMatrix();


/* Stream */

const stream=
canvas.captureStream(fps);


let mime=
"video/webm;codecs=vp9";

if(!MediaRecorder.isTypeSupported(mime)){

mime=
"video/webm;codecs=vp8";

}

if(!MediaRecorder.isTypeSupported(mime)){

mime="video/webm";

}


const recorder=
new MediaRecorder(
stream,
{
mimeType:mime,
videoBitsPerSecond:12000000
}
);

const chunks=[];

recorder.ondataavailable=e=>{

if(e.data.size)
chunks.push(e.data);

};


return new Promise(resolve=>{

recorder.onstop=()=>{

const blob=
new Blob(
chunks,
{type:"video/webm"}
);

const url=
URL.createObjectURL(blob);

const a=
document.createElement("a");

a.href=url;
a.download="FBX-Video.webm";

document.body.appendChild(a);
a.click();
a.remove();

setTimeout(
()=>URL.revokeObjectURL(url),
2000
);

modal.style.display="none";

progress.style.width="0%";
progressText.textContent="0%";

renderer.setSize(
canvas.clientWidth,
canvas.clientHeight,
false
);

camera.aspect=
canvas.clientWidth/
canvas.clientHeight;

camera.updateProjectionMatrix();

setTime(0);

resolve();

};


/* Aufnahme */

pause();
setTime(0);

recorder.start();


const start=
performance.now();


function capture(now){

const elapsed=
(now-start)/1000;


if(elapsed>=duration){

setTime(duration);

renderer.render(
scene,
camera
);

setTimeout(
()=>recorder.stop(),
100
);

return;

}


setTime(elapsed);


/* Animation */

if(mixer){

mixer.setTime(elapsed);

}


/* Video */

if(video){

try{

if(
Math.abs(
video.currentTime-elapsed
)>0.03
){

video.currentTime=elapsed;

}

}catch{}

}


/* Render */

renderer.render(
scene,
camera
);


/* Fortschritt */

const percent=
Math.floor(
elapsed/duration*100
);

progress.style.width=
percent+"%";

progressText.textContent=
percent+"%";


requestAnimationFrame(capture);

}

requestAnimationFrame(capture);

});

}


/* =========================
   KEYBOARD
========================= */

window.addEventListener(
"keydown",
e=>{

if(
e.target.tagName==="INPUT"||
e.target.tagName==="TEXTAREA"
)return;

if(e.code==="Space"){

e.preventDefault();
togglePlay();

}

if(e.code==="ArrowLeft"){

setTime(time-0.1);

}

if(e.code==="ArrowRight"){

setTime(time+0.1);

}

}
);


/* =========================
   START
========================= */

createRuler();
updateTimeline();

</script>

</body>
</html>
